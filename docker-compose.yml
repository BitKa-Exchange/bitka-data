networks:
  bitka-net:
    driver: bridge

services:
  # -------------------------------------------------------
  # 1. Source DB (PostgreSQL) - พอร์ต 5432
  # -------------------------------------------------------
  postgres:
    image: postgres:14-alpine
    container_name: bitka_source_db
    ports:
      - "${DB_PORT}:${DB_PORT}" # 5432:5432
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: bitka_main 
    command: 
      - "postgres"
      - "-c"
      - "wal_level=logical" 
    networks:
      - bitka-net
    volumes:
      - pg_source_data:/var/lib/postgresql/data
      # เพิ่มบรรทัดนี้ครับ 👇 มันจะ map ไฟล์จากเครื่องเรา เข้าไปในโฟลเดอร์ init ของ container
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
  # -------------------------------------------------------
  # 2. Data Warehouse (PostgreSQL) - พอร์ต 5433
  # -------------------------------------------------------
  warehouse:
    image: postgres:14-alpine
    container_name: bitka_warehouse
    ports:
      - "${DW_PORT_EXTERNAL}:${DW_PORT_INTERNAL}" # 5433:5432
    environment:
      POSTGRES_USER: ${DW_USER}
      POSTGRES_PASSWORD: ${DW_PASS}
      POSTGRES_DB: ${DW_DB_NAME}
    networks:
      - bitka-net
    volumes:
      - pg_warehouse_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  # -------------------------------------------------------
  # 3. Streaming Layer (Redpanda/Kafka) - พอร์ต 19092, 9092
  # -------------------------------------------------------
  redpanda:
    # แก้ไข: เปลี่ยนมาใช้ Image หลักของ Redpanda Data
    image: redpandadata/redpanda:v23.2.14
    container_name: bitka_redpanda
    command:
      - redpanda start
      - --smp 1  
      - --memory 1G 
      - --reserve-memory 0M
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:8083
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:8083
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:8084
    ports:
      - "19092:19092" 
      - "8083:8083"
      - "8084:8084"
      - "9644:9644"
    networks:
      - bitka-net

  # UI สำหรับดูข้อมูลใน Kafka (เข้าผ่าน http://localhost:8080)
  redpanda-console:
    # แก้ไข: เปลี่ยนมาใช้ Image หลัก
    image: redpandadata/console:v2.3.1
    container_name: bitka_console
    restart: on-failure
    entrypoint: /bin/sh
    command: -c "echo \"kafka.brokers=redpanda:9092\" > /tmp/config.yml; /app/console"
    ports:
      - "8080:8080"
    depends_on:
      - redpanda
    networks:
      - bitka-net

  # -------------------------------------------------------
  # 4. CDC Connector (Debezium)
  # -------------------------------------------------------
  connect:
    image: quay.io/debezium/connect:2.4
    container_name: bitka_debezium
    ports:
      # แก้ไข: เปลี่ยน Port แมพออกมาเป็น 8085 เพื่อไม่ให้ชนกับ Redpanda Proxy (8083)
      - "8085:8083" 
    environment:
      BOOTSTRAP_SERVERS: redpanda:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: my_connect_configs
      OFFSET_STORAGE_TOPIC: my_connect_offsets
      STATUS_STORAGE_TOPIC: my_connect_statuses
    depends_on:
      - redpanda
      - postgres
    networks:
      - bitka-net
  

  # ... (services อื่นๆ ด้านบน: postgres, warehouse, redpanda, connect)

  # -------------------------------------------------------
  # 5. Auto Config Connector (ตัวช่วยยิงคำสั่งอัตโนมัติ)
  # -------------------------------------------------------
  connector-setup:
    image: curlimages/curl:latest
    container_name: bitka_connector_setup
    networks:
      - bitka-net
    depends_on:
      - connect
    volumes:
      - ./connector.json:/config/connector.json
    command: >
      /bin/sh -c "
        echo 'Waiting for Debezium to be ready...';
        # วนลูปรอจนกว่า Debezium API (port 8083) จะตอบกลับมาว่าพร้อม (HTTP 200)
        while [ $$(curl -s -o /dev/null -w %{http_code} http://connect:8083/) -ne 200 ]; do
          echo '... waiting for Debezium API ...';
          sleep 5;
        done;
        echo 'Debezium is ready! Registering connector...';
        # ยิงคำสั่ง Register
        curl -X POST -H 'Content-Type: application/json' http://connect:8083/connectors/ -d @/config/connector.json;
        echo 'Done!';
      "


  # ... (services อื่นๆ)

  # -------------------------------------------------------
  # 6. Producer Simulator (ตัวปั๊มข้อมูล)
  # -------------------------------------------------------
  producer:
    build: .
    container_name: bitka_producer
    depends_on:
      - postgres
      - connect
    environment:
      # ชี้ไปหา Database Container โดยตรง (ใช้ชื่อ service 'postgres')
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
    networks:
      - bitka-net

  # ... (ต่อจาก producer)

  # -------------------------------------------------------
  # 7. Consumer Worker (Batch Processing)
  # -------------------------------------------------------
  consumer:
    build: .  # ใช้ Dockerfile ตัวเดิมที่ root
    container_name: bitka_consumer
    restart: always # ถ้ารันแล้วพัง ให้มันลองใหม่ (เผื่อ Kafka ยังไม่พร้อม)
    depends_on:
      - warehouse
      - redpanda
    volumes:
      # Map โฟลเดอร์เข้าไป เพื่อให้เจอไฟล์ script
      - ./data-platform/scripts:/app/data-platform/scripts
    environment:
      KAFKA_BROKER: redpanda:9092
      DW_HOST: warehouse
      DW_PORT: 5432
      DW_USER: warehouse_admin
      DW_PASS: warehouse_password
      DW_NAME: bitka_dw
    # สั่งรันไฟล์ consumer.py ที่อยู่ในโฟลเดอร์ scripts
    command: ["python", "-u", "data-platform/scripts/consumer.py"]
    networks:
      - bitka-net


  # ... (ต่อจาก consumer)

  # -------------------------------------------------------
  # 8. Dashboard (Streamlit) - พอร์ต 8501
  # -------------------------------------------------------
  dashboard:
    build: .
    container_name: bitka_dashboard
    depends_on:
      - warehouse
    environment:
      DW_HOST: warehouse
      DW_PORT: 5432
      DW_USER: warehouse_admin
      DW_PASS: warehouse_password
      DW_NAME: bitka_dw
    volumes:
      - ./data-platform:/app/data-platform
    # คำสั่งรัน Streamlit
    command: ["streamlit", "run", "data-platform/dashboard.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501" # เข้าผ่าน Browser ที่ http://localhost:8501
    networks:
      - bitka-net

volumes:
  pg_source_data:
  pg_warehouse_data: