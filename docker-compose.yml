networks:
  bitka-net:
    driver: bridge

services:
  # -------------------------------------------------------
  # 1. Source DB (PostgreSQL) - พอร์ต 5432
  # -------------------------------------------------------
  postgres:
    image: postgres:14-alpine
    container_name: bitka_source_db
    ports:
      - "${DB_PORT}:${DB_PORT}" # 5432:5432
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: bitka_main 
    command: 
      - "postgres"
      - "-c"
      - "wal_level=logical" 
    networks:
      - bitka-net
    volumes:
      - pg_source_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
  # -------------------------------------------------------
  # 2. Data Warehouse (PostgreSQL) - พอร์ต 5433
  # -------------------------------------------------------
  warehouse:
    image: postgres:14-alpine
    container_name: bitka_warehouse
    ports:
      - "${DW_PORT_EXTERNAL}:${DW_PORT_INTERNAL}" # 5433:5432
    environment:
      POSTGRES_USER: ${DW_USER}
      POSTGRES_PASSWORD: ${DW_PASS}
      POSTGRES_DB: ${DW_DB_NAME}
    networks:
      - bitka-net
    volumes:
      - pg_warehouse_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  # -------------------------------------------------------
  # 3. Streaming Layer (Redpanda/Kafka) - พอร์ต 19092, 9092
  # -------------------------------------------------------
  redpanda:
    image: redpandadata/redpanda:v23.2.14
    container_name: bitka_redpanda
    command:
      - redpanda start
      - --smp 1  
      - --memory 1G 
      - --reserve-memory 0M
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:8083
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:8083
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:8084
    ports:
      - "19092:19092" 
      - "8083:8083"
      - "8084:8084"
      - "9644:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    networks:
      - bitka-net

  # -------------------------------------------------------
  # UI สำหรับดูข้อมูลใน Kafka (เข้าผ่าน http://localhost:8080)
  # -------------------------------------------------------
  redpanda-console:
    image: redpandadata/console:v2.3.1
    container_name: bitka_console
    restart: on-failure
    environment:
      KAFKA_BROKERS: "redpanda:9092"
    ports:
      - "8080:8080"
    depends_on:
      - redpanda
    networks:
      - bitka-net

  # -------------------------------------------------------
  # 4. CDC Connector (Debezium)
  # -------------------------------------------------------
  connect:
    image: quay.io/debezium/connect:2.4
    container_name: bitka_debezium
    ports:
      - "8085:8083" 
    environment:
      BOOTSTRAP_SERVERS: redpanda:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: my_connect_configs
      OFFSET_STORAGE_TOPIC: my_connect_offsets
      STATUS_STORAGE_TOPIC: my_connect_statuses
    depends_on:
      - redpanda
      - postgres
    networks:
      - bitka-net
  


  # -------------------------------------------------------
  # 5. Auto Config Connector (Clean Version)
  # -------------------------------------------------------
  connector-setup:
    image: alpine:latest
    container_name: bitka_connector_setup
    networks:
      - bitka-net
    depends_on:
      - connect
    volumes:
      - ./connector.json:/config/connector.json
    environment:
      DB_HOST: postgres
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
    command: >
      /bin/sh -c "
        apk add --no-cache curl gettext;

        echo 'Waiting for Debezium to be ready...';
        while [ $$(curl -s -o /dev/null -w %{http_code} http://connect:8083/) -ne 200 ]; do
          echo '... waiting for Debezium API ...';
          sleep 5;
        done;

        echo 'Debezium is ready! Preparing configuration...';
        
        envsubst < /config/connector.json > /tmp/connector_config.json;
        
        echo 'Registering connector...';
        curl -X POST -H 'Content-Type: application/json' http://connect:8083/connectors/ -d @/tmp/connector_config.json;
        
        echo 'Done!';
      "

  # -------------------------------------------------------
  # 6. Producer Simulator (ตัวปั๊มข้อมูล)
  # -------------------------------------------------------
  producer:
    build: .
    container_name: bitka_producer
    depends_on:
      - postgres
      - connect
      - redpanda
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      KAFKA_BROKER: redpanda:9092
    command: ["python", "-u", "producer_simulator.py"] 
    networks:
      - bitka-net


  # -------------------------------------------------------
  # 7. Consumer Worker (Batch Processing)
  # -------------------------------------------------------
  consumer:
    build: . 
    container_name: bitka_consumer
    restart: always 
    depends_on:
      - warehouse
      - redpanda
    environment:
      KAFKA_BROKER: redpanda:9092
      DW_HOST: warehouse
      DW_PORT: 5432
      DW_USER: warehouse_admin
      DW_PASS: warehouse_password
      DW_NAME: bitka_dw
    command: ["python", "-u", "data-platform/scripts/consumer.py"]
    networks:
      - bitka-net


  # -------------------------------------------------------
  # 8. Dashboard (Streamlit) - พอร์ต 8501
  # -------------------------------------------------------
  dashboard:
    build: .
    container_name: bitka_dashboard
    depends_on:
      - warehouse
    environment:
      DW_HOST: warehouse
      DW_PORT: 5432
      DW_USER: warehouse_admin
      DW_PASS: warehouse_password
      DW_NAME: bitka_dw
    volumes:
      - ./data-platform:/app/data-platform
    command: ["streamlit", "run", "data-platform/dashboard.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501" # เข้าผ่าน Browser ที่ http://localhost:8501
    networks:
      - bitka-net

volumes:
  pg_source_data:
  pg_warehouse_data:
  redpanda_data: